 {name:"국정 운영 설명회",desc:"임기 동안의 정책 기록을 공개합니다.",delta:[4,-5,2,0]},
 {name:"대규모 선거 유세",desc:"전국 단위 선거 유세를 진행합니다.",delta:[8,-20,0,0]}
];
let game=null;

function safe(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function clamp(n,lo,hi){return Math.max(lo,Math.min(hi,n));}
function shuffle(items){let a=items.slice();for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function deck(){let international=shuffle(EVENTS.filter(e=>e.cat==="외교").map(e=>e.id)).slice(0,2);
 let domestic=shuffle(EVENTS.filter(e=>e.cat!=="외교"&&e.id!=="secret").map(e=>e.id)).slice(0,5);
 let selection=shuffle(international.concat(domestic));selection.splice(3,0,"secret");return selection;}
function load(){try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===2&&typeof v.name==="string"&&v.stats&&Array.isArray(v.deck)&&Array.isArray(v.history)&&Array.isArray(v.news))return v;}catch(e){}return null;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(game));}catch(e){console.warn("자동 저장 실패",e);}}
function go(phase){game.phase=phase;persist();render();window.scrollTo(0,0);}
function btn(label,action,extra,css){return '<button class="'+(css||"")+'" data-action="'+action+'" '+(extra||"")+'>'+label+'</button>';}
function effectHTML(d){return '<div class="effects">'+d.map((n,i)=>'<span>'+LABELS[i]+' '+(n>0?"+":"")+n+'</span>').join("")+'</div>';}
function statsHTML(){return '<div class="stats">'+Object.keys(game.stats).map((k,i)=>{
 let v=game.stats[k], max=k==="budget"?150:100;
 return '<div class="stat"><span>'+ICONS[i]+' '+LABELS[i]+'</span><b>'+v+(k==="approval"?"%":"")+'</b><div class="meter"><i style="width:'+(v/max*100)+'%"></i></div></div>';
}).join("")+'</div>';}
function eventAt(){return EVENTS.find(e=>e.id===game.deck[game.turn]);}
function person(role){return ROLES.find(r=>r.id===role).people[game.cabinet[role]];}
function impacts(option,event){
 let d=option[1].slice();
 if(person("economy").bonus==="save"&&d[1]<0)d[1]=Math.min(0,d[1]+4);
 if(person("economy").bonus==="growth"&&d[2]>0)d[2]+=2;
 if(event.cat==="외교"&&person("foreign").bonus==="ties"&&d[3]>0)d[3]+=4;
 if(event.cat==="외교"&&person("foreign").bonus==="trade"&&d[2]>0)d[2]+=3;
 if(person("chief").bonus==="public"&&d[0]>0)d[0]+=2;
 if(event.cat==="재난"&&person("chief").bonus==="crisis"&&d[0]>0)d[0]+=3;
 return d;
}
function apply(d){Object.keys(game.stats).forEach((k,i)=>game.stats[k]=clamp(game.stats[k]+d[i],0,k==="budget"?150:100));}
function start(){
 let name=document.getElementById("president-name").value.trim().slice(0,20);
 if(!name){alert("대통령 이름을 입력해 주세요.");return;}
 if(load()&&!confirm("기존 저장 기록을 지우고 새 게임을 시작할까요?"))return;
 game={version:2,phase:"appoint",name,term:1,turn:0,appointIndex:0,stats:{approval:50,budget:100,economy:50,relations:50},cabinet:{},deck:[],history:[],news:[],latest:null,elected:false,previousPhase:"game"};
 persist();render();
}
function appoint(i){
 if(game.phase!=="appoint"||![0,1].includes(i))return;
 let role=ROLES[game.appointIndex];if(!role)return;
 game.cabinet[role.id]=i;game.appointIndex++;
 if(game.appointIndex===ROLES.length){game.deck=deck();go("play");}else go("appoint");
}
function choose(i){
 if(game.phase!=="play")return;
 let e=eventAt();if(!e||!e.options[i])return;
 let c=e.options[i],d=impacts(c,e);apply(d);
 let reaction=d[0]>0?"정책 발표 후 기대를 나타내는 시민들의 반응이 나왔습니다. 후속 조치를 지켜보자는 의견도 이어졌습니다.":d[0]<0?"정책 발표 후 우려를 나타내는 시민들의 반응이 나왔습니다. 정부의 설명을 요청하는 목소리도 나왔습니다.":"시민들 사이에서 다양한 반응이 나왔습니다. 향후 추진 과정에 관심이 모이고 있습니다.";
 let item={term:game.term,turn:game.turn+1,category:e.cat,title:e.title,choice:c[0],story:c[2],reaction,delta:d};
 game.latest=item;game.news.unshift(item);game.history.push(item);go("news");
}
function next(){
 if(game.phase!=="news")return;
 game.turn++;
 if(game.turn>=ROUNDS)go(game.term===1?"election":"end");
 else go("play");
}
function election(i){
 if(game.phase!=="election"||!CAMPAIGNS[i])return;
 let c=CAMPAIGNS[i];apply(c.delta);
 let s=game.stats;
 game.elected=s.approval>=58&&s.economy>=45&&s.budget>=15&&s.relations>=35;
 game.history.push({term:1,turn:"선거",category:"선거",title:"재선 도전",choice:c.name,story:game.elected?"가상 선거에서 재선 성공":"가상 선거에서 재선 실패",reaction:"게임 내 가상 규칙에 따라 결정된 결과입니다.",delta:c.delta});
 go("electionResult");
}
function secondTerm(){
 if(game.phase!=="electionResult"||!game.elected)return;
 game.term=2;game.turn=0;game.appointIndex=0;game.cabinet={};game.deck=[];game.latest=null;go("appoint");
}
function reset(){if(!confirm("저장된 게임 기록을 삭제하고 처음부터 시작할까요?"))return;try{localStorage.removeItem(KEY);}catch(e){}game=null;render();}
function intro(){
 let saved=load();
 return '<section class="card hero"><span class="tag">WELCOME TO BAGANEUM REPUBLIC</span>'+
 '<p class="stage-kicker">★ 오늘부터, 내가 대통령</p><h2>바가늠공화국의<br><em>대통령이 되어봐!</em></h2>'+
 '<p>당신의 결정으로 움직이는 작은 공화국. 내각을 꾸리고, 국가 위기에 대응하고, 재선에 도전하세요.</p>'+
 '<div class="flag-stage"><img src="assets/baganeum-flag.png" alt="직접 그린 바가늠공화국 국기"></div>'+
 (saved?'<div class="notice">💾 저장된 게임: '+safe(saved.name)+' 대통령 · '+saved.term+'기</div>'+btn("저장된 게임 이어하기 →","resume")+'<div class="rule"></div>':"")+
 '<label for="president-name">대통령 이름</label><input id="president-name" maxlength="20" placeholder="이름을 입력하세요" autocomplete="off">'+
 btn("🏛️ 취임 선서하고 시작하기 →","start")+'</section>'+
 '<section class="card"><span class="tag">HOW TO PLAY</span><h3>당신의 첫 번째 국정 과제</h3><p>👔 나만의 내각 구성<br>📋 매 임기 8개의 국정 결정<br>📡 결정 직후 속보와 시민 반응<br>🗳️ 첫 임기 종료 후 재선 도전</p></section>';
}
function appointment(){
 let role=ROLES[game.appointIndex];
 return '<section class="card dark"><span class="tag">CABINET · '+game.term+'기 '+(game.appointIndex+1)+' / 3</span>'+
 '<div class="flag-head"><div><p class="stage-kicker light">대통령의 첫 번째 임무</p><h2>'+role.title+' 임명</h2></div>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div>'+
 '<p>'+safe(game.name)+' 대통령님, 함께 국정을 운영할 인물을 선택하세요. 임명한 사람에 따라 정책의 게임 지표가 달라집니다.</p></section>'+
 role.people.map((p,i)=>'<section class="card"><span class="tag">CANDIDATE 0'+(i+1)+'</span><h2>'+p.name+'</h2><p><b>'+p.style+'</b></p><div class="notice">'+p.detail+'</div>'+btn(p.name+" 임명하기 →","appoint",'data-index="'+i+'"')+'</section>').join("");
}
function advice(e){
 return '<section class="card"><h3>💬 참모 회의</h3>'+
 '<div class="advice"><b>경제부 장관 · '+person("economy").name+'</b><br>현재 국가 재정은 '+game.stats.budget+'입니다. 이번 선택지의 기본 재정 변화는 '+e.options.map(o=>(o[1][1]>0?"+":"")+o[1][1]).join(" / ")+'입니다.</div>'+
 '<div class="advice"><b>외교부 장관 · '+person("foreign").name+'</b><br>현재 국제관계 지수는 '+game.stats.relations+'입니다. '+(e.cat==="외교"?"이번 협상의 재정 및 대외관계 변화를 함께 확인하세요.":"대외적 파급효과도 함께 검토하겠습니다.")+'</div>'+
 '<div class="advice"><b>비서실장 · '+person("chief").name+'</b><br>정책 결정 후 가상의 뉴스와 시민 반응을 확인하겠습니다.</div></section>';
}
function play(){
 let e=eventAt();
 if(!e)return '<section class="card"><h2>이벤트를 불러올 수 없습니다.</h2>'+btn("처음으로","reset")+'</section>';
 return '<section class="card dark"><div class="round-head"><div class="round-progress"><span class="tag">'+game.term+'기 · 국정 운영 중</span><b>TURN '+(game.turn+1)+' / '+ROUNDS+'</b></div>'+
 '<div class="progress-dots">'+Array.from({length:ROUNDS},(_,i)=>'<i class="'+(i<game.turn?"done":i===game.turn?"now":"")+'"></i>').join("")+'</div></div>'+
 '<div class="flag-head"><div><p class="stage-kicker light">대통령 집무실</p><h2>'+safe(game.name)+' 대통령</h2></div>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div><p>바가늠공화국의 새로운 소식이 도착했습니다.</p></section>'+
 statsHTML()+
 '<section class="card event-card '+(e.id==="secret"?"secret":"")+'"><div class="event-head"><span class="tag">'+e.cat+' · NATIONAL ISSUE</span>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div>'+
 '<h2>'+e.title+'</h2><p>'+e.desc+'</p>'+
 (e.id==="secret"?'<div class="letter"><div class="flag-head"><strong>💌 대통령 전용 서신</strong>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div><p>'+safe(game.name)+' 대통령님, 뿡뿡 뿌와앙 히히 ❤️</p></div>':"")+
 '<div class="rule"></div><h3>어떤 결정을 내리시겠습니까?</h3>'+
 e.options.map((o,i)=>btn('<strong>0'+(i+1)+' · '+o[0]+'</strong><small>선택 시 바뀌는 게임 지표</small>'+effectHTML(impacts(o,e)),"choose",'data-index="'+i+'"',"choice")).join("")+
 '</section>'+advice(e)+
 '<section class="card"><span class="tag">MY CABINET</span><h3>👔 임명된 내각</h3>'+ROLES.map(r=>'<p><b>'+r.title+'</b> · '+person(r.id).name+' ('+person(r.id).style+')</p>').join("")+'</section>'+
 '<section class="card"><h3>📜 국정 기록</h3>'+btn("지난 정책과 뉴스 확인","history","","secondary")+'</section>';
}
function news(){
 let n=game.latest;
 return '<section class="card dark"><span class="tag">PRESIDENTIAL BRIEFING</span><div class="flag-head"><div><h2>📡 국정 브리핑</h2><p>'+safe(game.name)+' 대통령 · '+game.term+'기</p></div>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div></section>'+statsHTML()+
 '<section class="card"><div class="news-masthead"><div><strong>바가늠일보</strong><p class="small muted">BAGANEUM DAILY · 가상 뉴스</p></div>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div>'+
 '<div class="ticker">● BREAKING NEWS · 속보</div><div class="news"><span class="tag">'+n.category+'</span><h3>'+n.title+'… 정부, '+n.choice+' 발표</h3><p>'+n.story+'</p></div>'+
 '<div class="report-pull"><b>👥 시민들의 반응</b><p>'+n.reaction+'</p></div><div class="rule"></div><h3>📊 이번 결정의 게임 지표 변화</h3>'+effectHTML(n.delta)+
 '<div class="notice">이 뉴스와 시민 반응, 정책 효과는 모두 게임을 위한 가상 설정입니다.</div>'+
 btn(game.turn+1===ROUNDS?"임기 종료 및 결과 확인 →":"다음 국정 현안 →","next")+
 btn("전체 뉴스 보기","history","","secondary")+'</section>';
}
function electionPage(){
 return '<section class="card dark"><div class="flag-head"><div><span class="tag">ELECTION DAY</span><h2>🗳️ 제1기 임기 종료</h2></div>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div><p>'+safe(game.name)+' 대통령님의 첫 번째 임기가 끝났습니다. 재선에 도전할 수 있습니다.</p></section>'+statsHTML()+
 '<section class="card"><h2>재선 선거 활동</h2><p>선거 활동을 하나 선택하세요. 가상의 선거 규칙에 따라 결과가 결정됩니다.</p>'+
 '<div class="notice">게임 전용 조건: 국민 지지도 58 이상 · 경제 지수 45 이상 · 국가 재정 15 이상 · 국제관계 35 이상<br>실제 선거 결과를 예측하는 규칙이 아닙니다.</div>'+
 CAMPAIGNS.map((c,i)=>btn('<strong>'+c.name+'</strong><small>'+c.desc+'</small>'+effectHTML(c.delta),"election",'data-index="'+i+'"',"choice")).join("")+
 btn("재선에 도전하지 않고 퇴임","retire","","secondary")+'</section>';
}
function electionResult(){
 return '<section class="card result-stage"><span class="tag">OFFICIAL ELECTION RESULT</span>'+
 '<div class="flag-stage"><img src="assets/baganeum-flag.png" alt="직접 그린 바가늠공화국 국기"></div>'+
 '<h2>'+(game.elected?"🎉 재선 성공!":"🏛️ 대통령 임기 종료")+'</h2>'+
 '<p>'+(game.elected?"바가늠공화국의 두 번째 임기를 시작할 수 있습니다.":"바가늠공화국의 가상 선거에서 재선에 실패했습니다.")+'</p><div class="notice">가상의 게임 규칙에 따른 선거 결과입니다.</div></section>'+
 statsHTML()+'<section class="card">'+(game.elected?btn("제2기 대통령 취임하기 →","second"):btn("퇴임 및 최종 기록 확인 →","finish"))+'</section>';
}
function ending(){
 return '<section class="card result-stage"><span class="tag">PRESIDENTIAL FAREWELL</span>'+
 '<div class="flag-stage"><img src="assets/baganeum-flag.png" alt="직접 그린 바가늠공화국 국기"></div>'+
 '<h2>대통령 퇴임식 🎉</h2><p>'+safe(game.name)+' 대통령님의 바가늠공화국 국정 운영이 종료되었습니다.</p>'+
 '<div class="notice">최종 임기: '+game.term+'기 · 국정 현안 '+game.history.filter(h=>h.category!=="선거").length+'건 처리</div></section>'+
 statsHTML()+'<section class="card"><h3>📜 국정 운영 결과</h3>'+btn("전체 정책과 뉴스 기록 보기","history")+btn("새 게임 시작하기","reset","","secondary")+'</section>';
}
function historyPage(){
 return '<section class="card archive-card"><div class="flag-head"><div><span class="tag">PRESIDENTIAL ARCHIVE</span><h2>📜 국정 운영 기록</h2></div>'+"<img class=\"flag-small\" src=\"assets/baganeum-flag.png\" alt=\"직접 그린 바가늠공화국 국기\">"+'</div><p>'+safe(game.name)+' 대통령님의 모든 정책과 뉴스 기록입니다.</p>'+
 (game.history.length?game.history.map(h=>'<div class="rule"></div><p><b>'+h.term+'기 · '+h.turn+'번째 · '+h.title+'</b><br>선택: '+h.choice+'</p><p class="muted small">'+h.story+'</p>'+effectHTML(h.delta)).join(""):"<p>아직 국정 기록이 없습니다.</p>")+
 btn("이전 화면으로 돌아가기","back")+'</section>';
}
function render(){
 let page=!game?intro():({
  appoint:appointment,play:play,news:news,election:electionPage,
  electionResult:electionResult,end:ending,history:historyPage
 }[game.phase]||intro)();
 app.innerHTML=page;
}
document.addEventListener("click",function(e){
 let b=e.target.closest("button[data-action]");if(!b)return;
 let action=b.dataset.action,i=Number(b.dataset.index);
 if(action==="start")start();
 else if(action==="resume"){let saved=load();if(saved){game=saved;render();}}
 else if(action==="appoint")appoint(i);
 else if(action==="choose")choose(i);
 else if(action==="next")next();
 else if(action==="election")election(i);
 else if(action==="second")secondTerm();
 else if(action==="finish")go("end");
 else if(action==="retire"){game.elected=false;go("end");}
 else if(action==="history"){game.previousPhase=game.phase;go("history");}
 else if(action==="back")go(game.previousPhase||"play");
 else if(action==="reset")reset();
});
render();
</script>
</body>
</html>
